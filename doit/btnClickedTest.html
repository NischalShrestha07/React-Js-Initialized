<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button clicked js </title>
</head>

<body>

    <button id="onclick">Click me</button>



</body>

<script>
    const grabbedBtn = document.getElementById('onclick')

    grabbedBtn.addEventListener('click', () => {
        alert('hey i had been clicked again.')
    })
</script>

</html>
